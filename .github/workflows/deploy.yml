name: Deploy backend to EC2

# Auto-deploys the backend to the EC2 box whenever backend-related files change
# on main. The frontend is deployed separately by Cloudflare Pages, so we only
# trigger on paths that affect the server image.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Never let two deploys run at once (a build on t3.micro is slow).
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Pin the server's host key so the connection can't be MITM'd
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -euo pipefail <<'DEPLOY'
            cd ~/DocMind/deploy
            echo "== pulling latest =="
            git pull origin main
            echo "== rebuilding + restarting stack =="
            docker compose -f docker-compose.prod.yml --env-file env.prod up -d --build
            echo "== pruning old images =="
            docker image prune -f
            echo "== status =="
            docker compose -f docker-compose.prod.yml --env-file env.prod ps
          DEPLOY

      - name: Health check
        run: |
          # The web container restarts during deploy (~15s of downtime), and the
          # t3.micro can be briefly slow, so retry before declaring failure.
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" https://docmind-jenish.duckdns.org/docs || echo 000)
            echo "attempt $i: /docs -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ backend healthy"
              exit 0
            fi
            sleep 6
          done
          echo "❌ backend did not return 200 after retries"
          exit 1
